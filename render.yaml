services:
  - type: web
    name: security-validation-platform
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: security-validation-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://security-validation-platform.vercel.app
      - key: BACKEND_URL
        value: https://security-validation-platform.onrender.com

databases:
  - name: security-validation-db
    plan: free
