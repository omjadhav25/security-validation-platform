# /etc/nginx/sites-available/svp-backend
# Replace YOUR-SSLIP-HOSTNAME with something like: 3-91-23-10.sslip.io
# (dashes, not dots, matching your EC2's Elastic IP)

server {
    listen 80;
    server_name YOUR-SSLIP-HOSTNAME;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
